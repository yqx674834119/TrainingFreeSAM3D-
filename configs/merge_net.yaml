# GroupMergeNet：把 FastSAM 分组合并到 ScanNet 实例粒度
# 数据：用户下载的 ESAM 官方 ScanNet 2D 导出（逐帧 instance/label PNG），split 用 ESAM 官方列表
dataset:
  root: /media/yqx/Win10Pro X64/ditr_work_data/ESAM_datasets/scannet_2D_extracted/2D
  train_list: /home/yqx/SegmentAnything3D/ESAM/data/scannet200/meta_data/scannetv2_train.txt
  val_list: /home/yqx/SegmentAnything3D/ESAM/data/scannet200/meta_data/scannetv2_val.txt
  frame_stride: 2                # 导出目录每 20 帧一张；2 => ESAM 的 40 帧间隔
  train_frames_per_scene: 8      # 均匀抽取；0 = 全部
  val_frames_per_scene: 0        # 验证场景用全部 40 帧间隔的帧
  val_scenes:                    # 与 docs/esam_granularity.zh-CN.md 相同的 16 个验证场景
    [scene0050_00, scene0084_00, scene0208_00, scene0328_00, scene0334_00, scene0412_00,
     scene0414_00, scene0441_00, scene0488_00, scene0580_00, scene0593_00, scene0595_00,
     scene0621_00, scene0663_00, scene0690_00, scene0693_00]
  intrinsic: [577.870605, 577.870605, 319.5, 239.5]   # ESAM 统一深度内参 fx fy cx cy

lifting_config: configs/query_lifting.yaml   # FastSAM 参数、20k 采样、KMeans 补组（与 ESAM 一致）
feature: backbone            # 节点特征 + group_cos 用哪一层（640 维，stride 32）
boundary_feature: proto      # 交界点局部对比用哪一层：必须是细分辨率层（proto: 32 维，stride 4）
cache_root: work_dirs/merge_cache

graph:
  backend: gpu            # gpu = 全矩阵运算（cdist + scatter，6–8 ms）；cpu = KD-tree 参考实现（56 ms）
  voxel: 0.02             # 建邻接图前体素化（米）；0 = 直接在 20k 点上查
  adjacency_eps: 0.05     # 两组点距 < ε 视为相邻（米）
  boundary_k: 32          # 每条边取最近的 k 对交界点算局部特征对比
  feature_centering: true # 先减帧均值再 L2（见 README：FastSAM 特征有大公共分量）

labels:
  # 缓存里存的是每组的多数 GT 与 purity；训练时按下面的阈值选边。实测 purity 0.6 比 0.8
  # 多拿到 75% 的标注边，且与严格标签的一致性为 100%（见 docs/merge_net.zh-CN.md）
  purity: 0.6
  min_labeled: 0.3

model:
  # 探针结论（docs/merge_net.zh-CN.md §1）：640 维特征只比 14 个边标量多 0.01 AUC，
  # 所以默认用 edge_only；full / geom_only 保留作消融
  kind: edge_only         # edge_only | geom_only | full
  hidden: 32              # edge_only 的隐层；full/geom_only 用 64
  feature_proj: 16
  message_passing: 1
  dropout: 0.1

training:
  epochs: 25
  frames_per_step: 32
  lr: 0.002
  weight_decay: 0.0001
  seed: 0
  objectness_weight: 0.5  # 节点「是 thing 物体」头的 loss 权重（edge_only 没有该头）

merge:
  linkage: average        # average | single
  threshold: null         # null = 在训练集上扫出 IoU 最优阈值并写入 checkpoint
  # 输出 mask 的过滤（对应 ESAM 的 npoint_thr=100 / inst_score_thr=0.3）；只作用于模型输出
  min_points: 100
  # objectness 只用来给 mask 打分排序，不做硬过滤：在留出训练帧上扫过 min_score ∈ {0.3..0.7}，
  # AP50 不升、IoU/召回下降（docs/merge_net.zh-CN.md §6），所以设 0
  min_score: 0.0

eval:
  min_gt_points: 100
  stuff_nyu40: [1, 2, 22]   # wall, floor, ceiling（NYU40 id），用于 2D PNG GT
  stuff_raw: [1, 3, 41]     # wall, floor, ceiling（ScanNet raw id），用于 ESAM 3D GT
  gt: 3d                    # 3d = ESAM 3D 传播的逐帧 GT（与 ESAM 粒度报告同协议）；2d = 数据集 instance PNG

# 提议打分（docs/mask_scorer.zh-CN.md）：候选 = FastSAM 原始重叠 mask ∪ GroupMergeNet 合并 mask，
# 打分器预测每个候选与最佳 GT 的 IoU，再做嵌套 NMS。
scorer:
  checkpoint: work_dirs/mask_scorer/scorer/model.pt
  nms_iou: 0.5
  nms_contain: 1.01       # 1.01 = 不做包含抑制（部件与整体可同时输出，召回高）；0.8 = 抑制嵌套，mask 数减半
  top_k: 20               # 与 ESAM 的 topk_insts 一致

# 流式场景级 Query Memory（docs/streaming.zh-CN.md，对标 ESAM OnlineMerge）：每帧的最终 mask 进入
# 体素占用记忆，跨帧匹配分 = max(包含度) × 投影特征余弦，匈牙利指派；记忆大小随场景体积而非帧数增长。
streaming:
  voxel: 0.05               # 记忆体素（米）；3 cm / 8 cm 都更差（消融见文档）
  match_score: contain_x_feat   # max_contain = 纯几何规则；contain_x_feat = 几何 × 投影特征余弦
  match_threshold: 0.3
  match_dilation: 1         # 匹配前把记忆侧体素膨胀 1 格，容忍视角间一格的偏移
  admit_score: 0.3          # 新 query 的提议分数门槛
  nms_contain: 0.8          # 进入记忆前的逐帧嵌套 NMS 包含阈值：比逐帧评估的 1.01 严，去掉部件/整体重复
  top_k: 20
  projection: work_dirs/stream/projection/proj/model.pt   # 跨帧特征投影头（640→512→128，InfoNCE，对标 ESAM MergeHead）
  segment_smooth: true      # 评估时按 ESAM 做 mesh-segment 平滑（ESAM 导出的 scene_masks 也是平滑后的）

# 跨帧合并 v2（docs/stream_merge_v2.zh-CN.md + 执行计划 stream_merge_v2_plan.zh-CN.md）：
# 窗口记忆 + 统一 MergeNet。帧内和跨帧是同一个任务；第一帧 = 现在的 MergeNet，之后每帧把
# 历史物体和本帧碎片一起重新粘。最近 window 帧（含本帧）可改，更早的定稿。
stream_v2:
  window: 5                # 可改窗口帧数（含本帧）；1 = 过去帧立即定稿（不改历史）
  past_unit: block         # block = 过去帧同物体的碎片合成一块；fragment = 逐碎片（消融）
  voxel: 0.05              # 体素（米），与 QueryMemory 相同
  touch_dilation: 1        # 节点间"接触"判定：膨胀格数
  threshold: 0.5           # 平均连接聚类的边阈值
  linkage: average_sparse  # 只用有边的簇对（堆 + 邻接表），语义与 average 相同
  admit_min_points: 100    # 全是本帧碎片的一组：总点数低于此不开新物体（ESAM npoint_thr）
  object_merge: true       # 允许两个定稿物体在同一组里合并（历史纠错）
  purity: 0.8              # 第 0 阶段 oracle 打分：两端纯度 >= 此值且多数 GT 相同才粘
  out_root: work_dirs/stream_v2
  holdout_scenes:          # 第 1 阶段留出：训练列表（1201 个场景，不含 16 个验证场景）排序后的最后 60 个。
                           # 只写一次；此后所有阈值标定 / 方案选择只用它们，16 个验证场景只做最终报告。
    [scene0656_03, scene0657_00, scene0659_00, scene0659_01, scene0661_00, scene0662_00,
     scene0662_01, scene0662_02, scene0666_00, scene0666_01, scene0666_02, scene0667_00,
     scene0667_01, scene0667_02, scene0668_00, scene0669_00, scene0669_01, scene0672_00,
     scene0672_01, scene0673_00, scene0673_01, scene0673_02, scene0673_03, scene0673_04,
     scene0673_05, scene0674_00, scene0674_01, scene0675_00, scene0675_01, scene0676_00,
     scene0676_01, scene0677_00, scene0677_01, scene0677_02, scene0679_00, scene0679_01,
     scene0680_00, scene0680_01, scene0681_00, scene0682_00, scene0683_00, scene0687_00,
     scene0688_00, scene0691_00, scene0691_01, scene0692_00, scene0692_01, scene0692_02,
     scene0692_03, scene0692_04, scene0694_00, scene0694_01, scene0698_00, scene0698_01,

<style>
/* Layout: a printable figure sheet — one plate per claim, caption under each, numbers in mono. */
:root{

  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#14171c; --surface:#1c2027; --ink:#e8eaee; --ink-2:#a2a8b3; --rule:#2d333d; --tint:#232831; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#14171c; --surface:#1c2027; --ink:#e8eaee; --ink-2:#a2a8b3; --rule:#2d333d; --tint:#232831; color-scheme:dark }

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-inline:20px;padding-block:32px 64px}
header{border-bottom:1px solid var(--rule);padding-bottom:20px;margin-bottom:28px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,3.6vw,38px);line-height:1.15;margin:.3em 0 .35em;text-wrap:balance}
.thesis{font-size:18px;max-width:62ch;margin:0 0 10px}
.meta{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2)}
.legend{display:flex;flex-wrap:wrap;gap:14px 22px;margin-top:14px;font-size:14px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.sw{width:14px;height:14px;border-radius:3px;display:inline-block}

figure{margin:0 0 40px;background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:18px 18px 14px}
.plate{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.plate h2{font-family:var(--f-display);font-weight:700;font-size:19px;margin:0}
.badge{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;padding:2px 8px;border-radius:999px;border:1px solid var(--rule);color:var(--ink-2)}
.badge.meas{border-color:var(--ours);color:var(--ours)}
.badge.plan{border-color:var(--raw);color:var(--raw)}
.scroll{overflow-x:auto}
svg{display:block;max-width:100%;height:auto;font-family:var(--f-body)}
svg text{fill:currentColor}
svg .mono{font-family:var(--f-mono)}
svg .dim{fill:var(--ink-2)}
figcaption{font-size:14.5px;color:var(--ink);margin-top:12px;max-width:80ch}
figcaption b{font-weight:600}
.src{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
table{border-collapse:collapse;font-size:14px;margin-top:8px;font-variant-numeric:tabular-nums}
th,td{padding:5px 10px;border-bottom:1px solid var(--rule);text-align:left}
th{font-weight:600;color:var(--ink-2);font-family:var(--f-mono);font-size:12px}
td.n{font-family:var(--f-mono);text-align:right}
@media print{body{background:#fff}figure{break-inside:avoid;border-color:#bbb}}
</style>

<div class="wrap">
<header>
  <div class="eyebrow">CVPR plan v2 · 原理图 · TrainingFreeSAM3D</div>
  <h1>Segment Anything, at Any Granularity</h1>
  <p class="thesis">分割基础模型没有答错，它答在了另一个粒度上。粒度对齐是 3D 实例分割误差的主导项，并且不需要训练就能解。</p>
  <div class="meta">已测数字均来自协议 A：16 个 ScanNet 验证场景 / 809 帧 / ESAM 3D 传播 GT / thing ≥100 点。标「预期」的图是设计意图。</div>
  <div class="legend">
    <span><i class="sw" style="background:var(--raw)"></i>冻结 VFM 的原始输出（部件粒度）</span>
    <span><i class="sw" style="background:var(--frozen)"></i>训练版方法 ESAM</span>
    <span><i class="sw" style="background:var(--ours)"></i>本文算子 / 上界</span>
  </div>
</header>
